name: Chancay vs Callao Maritime Explorer CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-smoke-test:
    name: 🧪 Quality Assurance & Headless Smoke Testing
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: 🔍 Static Code Analysis (Flake8 Linting)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce code style and complexity limits
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: 📂 Verify Maritime Dataset Snapshot & Metadata Integrity
        run: |
          python -c "
          import os, json, pandas as pd
          csv_path = 'data/dataset.csv'
          meta_path = 'data/metadata.json'
          assert os.path.exists(csv_path), 'Dataset CSV is missing!'
          assert os.path.exists(meta_path), 'Metadata JSON is missing!'
          df = pd.read_csv(csv_path)
          assert len(df) >= 2000, f'Expected at least 2000 records, found {len(df)}'
          required_cols = [
              'Shipment_ID', 'Booking_Date', 'Origin_Port', 'Destination_Port',
              'Maritime_Route', 'Cargo_Type', 'Shipping_Line', 'Container_TEUs',
              'Transit_Time_Days', 'Port_Dwell_Hours', 'Freight_Rate_USD_TEU',
              'Total_Logistics_Cost_USD', 'CO2_Emissions_Tons', 'Delivery_Status'
          ]
          for col in required_cols:
              assert col in df.columns, f'Missing required column: {col}'
          with open(meta_path, 'r', encoding='utf-8') as f:
              meta = json.load(f)
              assert 'study_region' in meta, 'Metadata missing study_region'
          print(f'[SUCCESS] Maritime dataset snapshot verified: {len(df)} shipments across Chancay and Callao!')
          "

      - name: 🧪 Verify App Import and Syntax
        run: |
          python -c "import app; print('[SUCCESS] Maritime app syntax and components imported successfully!')"

      - name: 🚀 Validate Headless Streamlit Server Startup
        run: |
          # Launch Streamlit in headless mode for 12 seconds; timeout exit code 124 is considered success
          timeout 12s streamlit run app.py --server.headless=true --server.port=8501 || [ $? -eq 124 ]
          echo "[SUCCESS] Streamlit maritime dashboard successfully launched in headless production mode!"
