name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Enforce code style and complexity limits
        flake8 . --count --max-complexity=12 --max-line-length=100 --statistics

    - name: Headless Smoke Test
      run: |
        # Timeout 10s for streamlit headless run.
        # Exit code 124 indicates that the server ran for 10s without crashing, which is success.
        timeout 10s streamlit run app.py --server.headless=true || exit_code=$?
        if [ "$exit_code" -eq 124 ]; then
          echo "Smoke test passed: Streamlit app initialized and ran without fatal exceptions."
          exit 0
        else
          echo "Smoke test failed: Streamlit exited unexpectedly with code $exit_code"
          exit 1
        fi
