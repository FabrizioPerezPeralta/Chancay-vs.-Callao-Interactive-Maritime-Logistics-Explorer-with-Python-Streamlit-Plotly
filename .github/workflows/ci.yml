name: Enterprise BI Explorer CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-smoke-test:
    name: 🧪 Quality Assurance & Headless Smoke Testing
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: 🔍 Static Code Analysis (Flake8 Linting)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce code style and complexity limits
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: 📂 Verify Dataset Snapshot & Metadata Integrity
        run: |
          python -c "
          import os, json, pandas as pd
          csv_path = 'data/dataset.csv'
          meta_path = 'data/metadata.json'
          assert os.path.exists(csv_path), 'Dataset CSV is missing!'
          assert os.path.exists(meta_path), 'Metadata JSON is missing!'
          df = pd.read_csv(csv_path)
          assert len(df) >= 2000, f'Expected at least 2000 records, found {len(df)}'
          required_cols = [
              'Order_ID', 'Order_Date', 'Ship_Date', 'Customer_ID', 'Segment',
              'Region', 'Category', 'Sub_Category', 'Sales', 'Quantity', 'Discount', 'Profit'
          ]
          for col in required_cols:
              assert col in df.columns, f'Missing required column: {col}'
          with open(meta_path, 'r', encoding='utf-8') as f:
              meta = json.load(f)
              assert 'schema' in meta, 'Metadata missing schema'
          print(f'[SUCCESS] Dataset snapshot verified successfully: {len(df)} records!')
          "

      - name: 🧪 Verify App Import and Syntax
        run: |
          python -c "import app; print('[SUCCESS] App syntax and components imported successfully!')"

      - name: 🚀 Validate Headless Streamlit Server Startup
        run: |
          # Launch Streamlit in headless mode for 10 seconds; timeout exit code 124 is considered success
          timeout 12s streamlit run app.py --server.headless=true --server.port=8501 || [ $? -eq 124 ]
          echo "[SUCCESS] Streamlit dashboard successfully launched in headless production mode!"
